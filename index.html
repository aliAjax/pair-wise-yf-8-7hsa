<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胶片分镜条核对台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">纸质放映胶片整理</p>
          <h1>胶片分镜条核对台</h1>
        </div>
        <div class="hero-stats">
          <div class="stat-alert">
            <span>待复查片段</span>
            <strong id="pendingCount">0</strong>
            <small class="stat-sub">问题源或同批关联</small>
          </div>
          <div>
            <span>可放时长</span>
            <strong id="playableDuration">0:00</strong>
            <small class="stat-sub">总时长 <b id="fullDuration">0:00</b></small>
          </div>
          <div>
            <span>破损片段</span>
            <strong id="damageCount">0</strong>
          </div>
          <div>
            <span>片段数</span>
            <strong id="segmentCount">0</strong>
          </div>
        </div>
      </header>

      <section class="toolbar">
        <label>
          胶片卷
          <input id="reelTitle" type="text" placeholder="例：春日试映A卷" />
        </label>
        <label>
          颜色偏移
          <select id="colorFilter">
            <option value="all">全部</option>
            <option value="正常">正常</option>
            <option value="偏红">偏红</option>
            <option value="偏青">偏青</option>
            <option value="偏黄">偏黄</option>
            <option value="褪色">褪色</option>
          </select>
        </label>
        <label>
          复查状态
          <select id="statusFilter">
            <option value="all">全部</option>
            <option value="pending">待复查</option>
            <option value="passed">复查合格</option>
            <option value="failed">复查不合格</option>
          </select>
        </label>
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="编号、批号、备注或处理人" />
        </label>
        <button id="exportBtn">导出清单</button>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>录入片段</h2>
          <form id="segmentForm" class="segment-form">
            <label>
              片段编号
              <input id="codeInput" required placeholder="A-014" />
            </label>
            <label>
              洗印批号
              <input id="batchInput" required placeholder="例：洗-2609-01" />
            </label>
            <label>
              时长秒数
              <input id="durationInput" required type="number" min="1" value="12" />
            </label>
            <label>
              颜色偏移
              <select id="shiftInput">
                <option value="正常">正常</option>
                <option value="偏红">偏红</option>
                <option value="偏青">偏青</option>
                <option value="偏黄">偏黄</option>
                <option value="褪色">褪色</option>
              </select>
            </label>
            <label>
              破损情况
              <select id="damageInput">
                <option value="完好">完好</option>
                <option value="轻微划痕">轻微划痕</option>
                <option value="齿孔破损">齿孔破损</option>
                <option value="接片松动">接片松动</option>
                <option value="需跳过">需跳过</option>
              </select>
            </label>
            <label>
              缩略图
              <input id="thumbInput" type="file" accept="image/*" />
            </label>
            <label>
              备注
              <textarea id="noteInput" rows="4" placeholder="试映前要留意的画面、接片或声音点"></textarea>
            </label>
            <button class="primary" type="submit">加入放映清单</button>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>放映顺序</h2>
            <span>待复查段保留原位置，仅不计入可放时长</span>
          </div>
          <div id="segmentList" class="segment-list"></div>
        </section>

        <aside class="panel warning-panel">
          <div class="panel-head">
            <h2>同批风险核对</h2>
            <span id="riskSummary">按洗印批号分组</span>
          </div>
          <div id="warningList" class="warning-list"></div>
        </aside>
      </section>
    </main>

    <div id="modalBackdrop" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <form id="reviewForm" class="modal-form" hidden>
          <h2>复查不合格处理登记</h2>
          <p class="modal-target" id="reviewTarget"></p>
          <label>
            处理人
            <input id="handlerInput" required placeholder="例：王姐" />
          </label>
          <label>
            处理说明
            <textarea id="handlerNoteInput" rows="4" required placeholder="不合格原因及后续处理方式（修复、隔离或报废等）"></textarea>
          </label>
          <div class="modal-actions">
            <button type="button" id="reviewCancel">取消</button>
            <button class="primary" type="submit">保存处理结果</button>
          </div>
        </form>

        <form id="editForm" class="modal-form" hidden>
          <h2>编辑片段</h2>
          <p class="modal-target" id="editTarget"></p>
          <label>
            片段编号
            <input id="editCode" required />
          </label>
          <label>
            洗印批号
            <input id="editBatch" required placeholder="例：洗-2609-01" />
          </label>
          <label>
            时长秒数
            <input id="editDuration" required type="number" min="1" />
          </label>
          <label>
            颜色偏移
            <select id="editShift">
              <option value="正常">正常</option>
              <option value="偏红">偏红</option>
              <option value="偏青">偏青</option>
              <option value="偏黄">偏黄</option>
              <option value="褪色">褪色</option>
            </select>
          </label>
          <label>
            破损情况
            <select id="editDamage">
              <option value="完好">完好</option>
              <option value="轻微划痕">轻微划痕</option>
              <option value="齿孔破损">齿孔破损</option>
              <option value="接片松动">接片松动</option>
              <option value="需跳过">需跳过</option>
            </select>
          </label>
          <label>
            备注
            <textarea id="editNote" rows="3"></textarea>
          </label>
          <div class="modal-actions">
            <button type="button" id="editCancel">取消</button>
            <button class="primary" type="submit">保存并重新判定</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
